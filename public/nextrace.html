<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Next Race</title>
        <link rel="stylesheet" href="/css/nextrace.css">
    </head>
<body>
    <div class="container-nextrace">
        <p class="connection-status">Not connected</p>
        <div class="race">
            <h2 class="message"></h2>
            <ul class="current-race-details"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>

        //page setup
        const socket = io({autoConnect: false})
        socket.auth = {interface: "next-race"}

        const status = document.querySelector(".connection-status")
        const message = document.querySelector(".message")
        const list = document.querySelector(".current-race-details")


        //connection
        socket.connect()
        socket.on('connect', () => {
            status.innerHTML = "Connected"
            // Request current upcoming race
            socket.emit('nextrace:get-state')
        })

        socket.on('disconnect', () => {
            status.innerHTML = "Disconnected"
        })


        //initial setup
        socket.on('upcoming-race', (sessions) => {
            updateNextRacePage(sessions)
        })


        //track sessions
        socket.on('front-desk:state', ({ sessions }) => {
            updateNextRacePage(sessions)
        })

        //select correction session with instruction
        function updateNextRacePage(sessions) {
            const raceInProgress = sessions.some(
                        race => race.status === "ongoing" ||
                        race.status === "finishing"
            );

            const nextRace = selectUpcomingSession(sessions)

            if (!nextRace) {
                updatePage(null, "")
                return
            }

            if (raceInProgress) {
                updatePage(nextRace, "Next Race")
            } else {
                updatePage(nextRace, "Please Proceed to Paddock")
            }
        }        


        //update page
        function updatePage(raceData, heading) {
            list.innerHTML = ""

            if (!raceData) {
                message.innerHTML = "No upcoming race"
                return
            }

            message.innerHTML = heading

            raceData.entries.forEach((driver) => {
                const item = document.createElement("li")
                item.classList.add("car-details")
                // ===== AI Extension: Begin =====
                item.textContent = window.racetrackUI?.driverLabel(driver.name, driver.carNumber) ?? `${driver.name} ${driver.carNumber}`
                // ===== AI Extension: End =====
                list.appendChild(item)
            })
        }


        //helpers
        function selectUpcomingSession(sessions) {
            return sessions.find(race => race.status === "upcoming")
        }

    </script>

</body>

</html>
