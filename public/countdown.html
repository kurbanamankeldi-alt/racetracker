<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link rel="stylesheet" href="/css/countdown.css">
</head>
<body>
     <p id="status-countdown">Not connected</p>    
     <div id="countdown-container">
        <div id="minutes">10</div>
        <div id="seconds">00</div>
     </div>
</body>


   <script src="/socket.io/socket.io.js"></script>
   <script> 
        const socket = io({
            autoConnect: false
        });

        socket.auth = {
            interface: "race-countdown"
        };

        socket.connect();
        
        const status = document.getElementById("status-countdown");

        socket.on('connect', () => {
            status.innerHTML = "connected";
            // Request the current countdown
            socket.emit('countdown:get-state');
        });

        socket.on('countdown:update', (countdown) => {
            displayTime(countdown.min, countdown.sec);
        });

        socket.on('countdown:ended', () => {
            status.innerHTML = "ended";
            document.getElementById("countdown-container").classList.add("hide");
        });

        function displayTime(min, sec) {
            document.getElementById("minutes").innerHTML = String(min).padStart(2, '0');
            document.getElementById("seconds").innerHTML = String(sec).padStart(2, '0');
        }    

   </script>
</html>
